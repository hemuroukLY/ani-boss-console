apiVersion: apps/v1
kind: Deployment
metadata:
  name: ani-boss-console
  namespace: ani-system
  labels:
    app: ani-boss-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ani-boss-console
  template:
    metadata:
      labels:
        app: ani-boss-console
    spec:
      nodeSelector:
        kubernetes.io/hostname: node1
      containers:
        - name: console
          image: docker.changqingyun.cn/ani/ani-boss-console:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ani-boss-console
  namespace: ani-system
  labels:
    app: ani-boss-console
spec:
  type: NodePort
  selector:
    app: ani-boss-console
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30082
